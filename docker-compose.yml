version: '3.8'

services:
      
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - .:/app  # Mount the current directory to the container's /app folder
    environment:
      - FASTAPI_APP=app.main:app  # Set environment variable to specify the FastAPI app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
